syntax = "proto3";

package zmk.keymap;

message Request {
    oneof request_type {
        bool get_keymap = 1;
        SetLayerBindingRequest set_layer_binding = 2;
        bool check_unsaved_changes = 3;
        bool save_changes = 4;
        bool discard_changes = 5;
        bool get_physical_layouts = 6;
        uint32 set_active_physical_layout = 7;
        MoveLayerRequest move_layer = 8;
        AddLayerRequest add_layer = 9;
        RemoveLayerRequest remove_layer = 10;
        RestoreLayerRequest restore_layer = 11;
        SetLayerPropsRequest set_layer_props = 12;

        // Fork (lenerdz): per-layer LED color maps. Tags >= 100 are reserved for
        // this fork so that a future upstream addition cannot collide with them.
        bool get_led_info = 100;
        uint32 get_led_map = 101;           // layer_id
        SetLedColorsRequest set_led_colors = 102;
        bool save_led_changes = 103;
        bool discard_led_changes = 104;
        uint32 restore_led_defaults = 105;  // layer_id

        // Fork (lenerdz): display (OLED) settings, tags 106 to 108.
        bool get_display_info = 106;
        SetDisplaySettingRequest set_display_setting = 107;
        bool restore_display_defaults = 108;

        // Fork (lenerdz): live status and firmware information (read only), tags 109 and 110.
        bool get_live_status = 109;
        bool get_firmware_info = 110;
    }
}

message Response {
    oneof response_type {
        Keymap get_keymap = 1;
        SetLayerBindingResponse set_layer_binding = 2;
        bool check_unsaved_changes = 3;
        SaveChangesResponse save_changes = 4;
        bool discard_changes = 5;
        PhysicalLayouts get_physical_layouts = 6;
        SetActivePhysicalLayoutResponse set_active_physical_layout = 7;
        MoveLayerResponse move_layer = 8;
        AddLayerResponse add_layer = 9;
        RemoveLayerResponse remove_layer = 10;
        RestoreLayerResponse restore_layer = 11;
        SetLayerPropsResponse set_layer_props = 12;

        // Fork (lenerdz): per-layer LED color maps.
        LedInfo get_led_info = 100;
        LedMap get_led_map = 101;
        SetLedColorsResponse set_led_colors = 102;
        SaveChangesResponse save_led_changes = 103;  // reuses the keymap result type
        bool discard_led_changes = 104;
        LedMap restore_led_defaults = 105;           // the map after the restore

        // Fork (lenerdz): display (OLED) settings.
        DisplayInfo get_display_info = 106;
        SetDisplaySettingResponse set_display_setting = 107;
        DisplayInfo restore_display_defaults = 108;  // the settings after the restore

        // Fork (lenerdz): live status and firmware information.
        LiveStatus get_live_status = 109;
        FirmwareInfo get_firmware_info = 110;
    }
}

message Notification {
    oneof notification_type {
        bool unsaved_changes_status_changed = 1;

        // Fork (lenerdz): true when any LED map differs from what is saved.
        bool unsaved_led_changes_status_changed = 100;
    }
}

message SaveChangesResponse {
    oneof result {
        bool ok = 1;
        SaveChangesErrorCode err = 2;
    }
}

enum SaveChangesErrorCode {
    SAVE_CHANGES_ERR_OK = 0;
    SAVE_CHANGES_ERR_GENERIC = 1;
    SAVE_CHANGES_ERR_NOT_SUPPORTED = 2;
    SAVE_CHANGES_ERR_NO_SPACE = 3;
}

enum SetLayerBindingResponse {
    SET_LAYER_BINDING_RESP_OK = 0;
    SET_LAYER_BINDING_RESP_INVALID_LOCATION = 1;
    SET_LAYER_BINDING_RESP_INVALID_BEHAVIOR = 2;
    SET_LAYER_BINDING_RESP_INVALID_PARAMETERS = 3;
}

message SetActivePhysicalLayoutResponse {
    oneof result {
        Keymap ok = 1;
        SetActivePhysicalLayoutErrorCode err = 2;
    }
}

enum MoveLayerErrorCode {
    MOVE_LAYER_ERR_OK = 0;
    MOVE_LAYER_ERR_GENERIC = 1;
    MOVE_LAYER_ERR_INVALID_LAYER = 2;
    MOVE_LAYER_ERR_INVALID_DESTINATION = 3;
}

message MoveLayerResponse {
    oneof result {
        Keymap ok = 1;
        MoveLayerErrorCode err = 2;
    }
}

message AddLayerResponse {
    oneof result {
        AddLayerResponseDetails ok = 1;
        AddLayerErrorCode err = 2;
    }
}

enum AddLayerErrorCode {
    ADD_LAYER_ERR_OK = 0;
    ADD_LAYER_ERR_GENERIC = 1;
    ADD_LAYER_ERR_NO_SPACE = 2;
}

message AddLayerResponseDetails {
    uint32 index = 1;
    Layer layer = 2;
}

message RemoveLayerResponse {
    oneof result {
        RemoveLayerOk ok = 1;
        RemoveLayerErrorCode err = 2;
    }
}

message RemoveLayerOk {
}

enum RemoveLayerErrorCode {
    REMOVE_LAYER_ERR_OK = 0;
    REMOVE_LAYER_ERR_GENERIC = 1;
    REMOVE_LAYER_ERR_INVALID_INDEX = 2;
}

message RestoreLayerResponse {
    oneof result {
        Layer ok = 1;
        RestoreLayerErrorCode err = 2;
    }
}

enum RestoreLayerErrorCode {
    RESTORE_LAYER_ERR_OK = 0;
    RESTORE_LAYER_ERR_GENERIC = 1;
    RESTORE_LAYER_ERR_INVALID_ID = 2;
    RESTORE_LAYER_ERR_INVALID_INDEX = 3;
}

enum SetLayerPropsResponse {
    SET_LAYER_PROPS_RESP_OK = 0;
    SET_LAYER_PROPS_RESP_ERR_GENERIC = 1;
    SET_LAYER_PROPS_RESP_ERR_INVALID_ID = 2;
}

enum SetActivePhysicalLayoutErrorCode {
    SET_ACTIVE_PHYSICAL_LAYOUT_ERR_OK = 0;
    SET_ACTIVE_PHYSICAL_LAYOUT_ERR_GENERIC = 1;
    SET_ACTIVE_PHYSICAL_LAYOUT_ERR_INVALID_LAYOUT_INDEX = 2;
}

message SetLayerBindingRequest {
    uint32 layer_id = 1;
    int32 key_position = 2;

    BehaviorBinding binding = 3;
}

message MoveLayerRequest {
    uint32 start_index = 1;
    uint32 dest_index = 2;
}

message AddLayerRequest {
}

message RemoveLayerRequest {
    uint32 layer_index = 1;
}

message RestoreLayerRequest {
    uint32 layer_id = 1;
    uint32 at_index = 2;
}

message SetLayerPropsRequest {
    uint32 layer_id = 1;
    string name = 2;
}

message Keymap {
    repeated Layer layers = 1;
    uint32 available_layers = 2;
    uint32 max_layer_name_length = 3;
}

message Layer {
    uint32 id = 1;
    string name = 2;
    repeated BehaviorBinding bindings = 3;
}

message BehaviorBinding {
    sint32 behavior_id = 1;
    uint32 param1 = 2;
    uint32 param2 = 3;
}

message PhysicalLayouts {
    uint32 active_layout_index = 1;
    repeated PhysicalLayout layouts = 2;
}

message PhysicalLayout {
    string name = 1;
    repeated KeyPhysicalAttrs keys = 2;
}

message KeyPhysicalAttrs {
    sint32 width = 1;
    sint32 height = 2;
    sint32 x = 3;
    sint32 y = 4;
    sint32 r = 5;
    sint32 rx = 6;
    sint32 ry = 7;
}

// ---------------------------------------------------------------------------
// Fork (lenerdz): per-layer LED color maps
//
// A map has `slot_count` slots, each one 24-bit 0xRRGGBB color. On the
// keyboard this fork is used on (a Corne with 54 slots):
//   0..41   key positions (the same numbering as the keymap bindings)
//   42..47  left underglow (LED chain order)
//   48..53  right underglow (LED chain order)
// A map belongs to a layer and is addressed by that layer's id (Layer.id from
// get_keymap), so it follows the layer when the layers are reordered.
// ---------------------------------------------------------------------------

message LedInfo {
    uint32 slot_count = 1;
    repeated uint32 layer_ids = 2;  // ids of the layers that own an editable map
    bool unsaved_changes = 3;
}

message LedMap {
    uint32 layer_id = 1;
    repeated uint32 colors = 2;     // exactly 54 entries; entries >= slot_count are 0
}

message LedColorEntry {
    uint32 slot = 1;
    uint32 rgb = 2;                 // 0xRRGGBB
}

message SetLedColorsRequest {
    uint32 layer_id = 1;
    repeated LedColorEntry entries = 2;  // at most 16 per request
}

enum SetLedColorsResponse {
    SET_LED_COLORS_RESP_OK = 0;
    SET_LED_COLORS_RESP_INVALID_LAYER = 1;
    SET_LED_COLORS_RESP_INVALID_SLOT = 2;
    SET_LED_COLORS_RESP_BUSY = 3;
}

// ---------------------------------------------------------------------------
// Fork (lenerdz): display (OLED) settings
//
// A list of numbered integer settings. For every setting it has, the firmware
// reports the current value and the range, so a client can draw a control
// without knowing the setting; the meaning of the ids is fixed (see README.md)
// so that a client can also label them. A change takes effect on the keyboard
// at once and the firmware keeps it across restarts by itself: there is no
// save or discard request.
// ---------------------------------------------------------------------------

message DisplayInfo {
    repeated DisplaySetting settings = 1;  // one entry per setting of the firmware
}

message DisplaySetting {
    uint32 id = 1;
    int32 value = 2;
    int32 min = 3;
    int32 max = 4;
    int32 default_value = 5;
}

message SetDisplaySettingRequest {
    uint32 id = 1;
    int32 value = 2;
}

enum SetDisplaySettingResponse {
    SET_DISPLAY_SETTING_RESP_OK = 0;
    SET_DISPLAY_SETTING_RESP_INVALID_ID = 1;
    SET_DISPLAY_SETTING_RESP_INVALID_VALUE = 2;
}

// ---------------------------------------------------------------------------
// Fork (lenerdz): live status and firmware information (read only)
//
// get_live_status is one snapshot of what the screens of the keyboard draw
// right now; a client that wants a live view asks for it again and again (a
// few times per second is enough, and it is cheap). get_firmware_info says
// what the firmware is and how much flash and RAM it uses; it does not change
// while the keyboard runs, so it is asked once.
//
// ZMK Studio talks to the central half (the one on USB), so every value is that
// half's, except the two that it knows about the other half: whether it is
// connected and its battery level. Nothing is kept: there is no save request,
// and no notification.
// ---------------------------------------------------------------------------

enum LiveOutput {
    LIVE_OUTPUT_NONE = 0;       // no host: the keyboard is not connected to anything
    LIVE_OUTPUT_USB = 1;
    LIVE_OUTPUT_BLE = 2;
}

enum LiveBleState {
    LIVE_BLE_OPEN = 0;          // the profile has no host paired (it is advertising)
    LIVE_BLE_PAIRED = 1;        // paired, but its host is not connected
    LIVE_BLE_CONNECTED = 2;
}

enum LiveUsbState {
    LIVE_USB_NONE = 0;          // nothing on the USB connector
    LIVE_USB_POWERED = 1;       // power, but the host has not set the keyboard up yet
    LIVE_USB_HID = 2;           // the host uses the keyboard
}

message LiveStatus {
    uint32 battery_central = 1;     // percent from 0 to 100; 255 when there is no reading
    uint32 battery_peripheral = 2;  // percent from 0 to 100; 255 when the other half has not reported
    bool peripheral_connected = 3;
    uint32 layer_index = 4;         // the highest active layer, as its index in the keymap order
    string layer_name = 5;          // the name of that layer (empty when it has none)
    uint32 wpm = 6;                 // words per minute now
    LiveOutput output = 7;          // where the keys go now
    uint32 ble_profile = 8;         // the selected Bluetooth profile, from 0
    LiveBleState ble_state = 9;     // the state of that profile
    LiveUsbState usb_state = 10;    // the state of the USB connector
    uint32 uptime_s = 11;           // seconds since the keyboard started
}

message FirmwareInfo {
    string keyboard = 1;            // the name of the keyboard (CONFIG_ZMK_KEYBOARD_NAME)
    string board = 2;               // the board (CONFIG_BOARD)
    string zephyr = 3;              // the version of Zephyr
    string build_id = 4;            // the commit that was built, short; empty when it is not known
    string build_branch = 5;        // the branch of that commit; empty when it is not known
    uint32 build_number = 6;        // the number of the CI run that built it; 0 when it is not known
    string build_date = 7;          // the day it was built, yyyy-mm-dd (UTC)
    uint32 flash_total = 8;         // bytes of flash for the program (the code partition)
    uint32 flash_used = 9;          // bytes of it that the program takes
    uint32 ram_total = 10;          // bytes of RAM
    uint32 ram_used = 11;           // bytes of it that the program takes at start (data, bss, stacks, heap)
}
